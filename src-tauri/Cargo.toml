[package]
name = "cd-catalog-premium"
version = "0.3.0"
edition = "2021"

[lib]
name = "cd_catalog_premium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-db = { path = "crates/core-db" }
core-scanner = { path = "crates/core-scanner" }
core-hash = { path = "crates/core-hash" }
core-parsers = { path = "crates/core-parsers" }
core-export = { path = "crates/core-export" }

[dev-dependencies]
tempfile = "3"
# Media fixtures for the scan tests, defined once in the parsers crate.
core-parsers = { path = "crates/core-parsers", features = ["test-fixtures"] }

[workspace]
members = [".", "crates/core-db", "crates/core-hash", "crates/core-parsers", "crates/core-scanner", "crates/core-export"]
