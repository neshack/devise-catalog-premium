[package]
name = "devise-catalog-premium"
version = "0.5.0"
edition = "2021"
rust-version = "1.87"
description = "Offline-first desktop catalog for discs, USB drives, NAS and archives."
authors = ["Nestor Peña (neshack)"]
license = "MIT"
repository = "https://github.com/neshack/devise-catalog-premium"
homepage = "https://github.com/neshack/devise-catalog-premium#readme"
keywords = ["tauri", "sqlite", "catalog", "offline", "file-indexer"]
categories = ["database", "filesystem"]

[lib]
name = "devise_catalog_premium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
core-db = { path = "crates/core-db" }
core-scanner = { path = "crates/core-scanner" }
core-hash = { path = "crates/core-hash" }
core-parsers = { path = "crates/core-parsers" }
core-export = { path = "crates/core-export" }

[dev-dependencies]
tempfile = "3"
# Media fixtures for the scan tests, defined once in the parsers crate.
core-parsers = { path = "crates/core-parsers", features = ["test-fixtures"] }

[workspace]
members = [".", "crates/core-db", "crates/core-hash", "crates/core-parsers", "crates/core-scanner", "crates/core-export"]
