[package]
name = "cd-catalog-premium"
version = "0.1.0"
edition = "2021"

[lib]
name = "cd_catalog_premium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = [".", "crates/core-db", "crates/core-hash", "crates/core-parsers", "crates/core-scanner"]
