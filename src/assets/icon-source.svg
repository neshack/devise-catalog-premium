<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Devise Catalog Premium">
  <!--
    Icono de la aplicación. Misma geometría que la marca en pantalla
    (src/components/Brand.tsx), con trazos más gruesos: a 32 px un trazo fino
    desaparece. El espectro sólo vive aquí y en la lectura en curso.
  -->
  <defs>
    <linearGradient id="spectral" gradientUnits="userSpaceOnUse" x1="512" y1="182" x2="842" y2="512">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.35" stop-color="#ffb02e"/>
      <stop offset="0.62" stop-color="#8fd96a"/>
      <stop offset="0.8" stop-color="#35c6d6"/>
      <stop offset="1" stop-color="#6a7cf5"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="#141816"/>
  <rect x="6" y="6" width="1012" height="1012" rx="224" fill="none" stroke="#2a312c" stroke-width="4"/>

  <circle cx="512" cy="512" r="330" fill="none" stroke="#ecefe9" stroke-width="44"/>
  <path d="M512 182a330 330 0 0 1 330 330" fill="none" stroke="url(#spectral)" stroke-width="76"/>
  <circle cx="512" cy="512" r="118" fill="none" stroke="#7d8a80" stroke-width="28"/>
</svg>
