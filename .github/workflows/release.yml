name: release

# Signed installers for the three desktop OSes (MVP criterion §7.5).
#
# Signing is optional at the workflow level and driven entirely by secrets:
# without them the same matrix still bundles and uploads *unsigned* artifacts,
# which is what a fork or a dry run gets. With them, the bundles are signed,
# notarized (macOS) and then *verified* — a build that claims to be signed but
# is not fails the job instead of shipping.
#
# Required secrets (see scripts/wizard-signing.sh, which asks for them):
#   macOS signing      APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#                      KEYCHAIN_PASSWORD, APPLE_SIGNING_IDENTITY
#   macOS notarization APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows signing    WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
# Each group switches its own steps on: an OS without its secrets still bundles
# and uploads, and the wizard's closing summary says which ones are missing.
# Linux packages are unsigned on purpose: the .deb/.AppImage formats have no
# OS-level signature check, and the equivalent (a GPG-signed package
# repository) is out of scope for 0.1.0. The RPM path can be GPG signed with
# TAURI_SIGNING_RPM_KEY when there is a repository to serve it from.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than ubuntu-latest: linuxdeploy's bundled `strip` chokes
          # on the `.relr.dyn` sections newer distros' libraries carry, which
          # kills AppImage bundling with "failed to run linuxdeploy".
          - { os: ubuntu-22.04, name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
    runs-on: ${{ matrix.os }}
    env:
      # Job-level so step `if:` conditions can see them (a step's own `env` is
      # not available to its own condition). The secret values themselves are
      # only handed to the steps that need them.
      MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      # Notarization needs the certificate *and* credentials for Apple's
      # notary service; a signed app that was never notarized is still refused
      # by Gatekeeper, so the two checks are reported separately.
      MACOS_NOTARIZING: ${{ secrets.APPLE_ID != '' && secrets.APPLE_CERTIFICATE != '' }}
      WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ── Signing material ────────────────────────────────────────────────
      - name: Import Apple Developer certificate
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12

      - name: Import Windows certificate
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $thumb = (Get-PfxCertificate -FilePath certificate.pfx -Password $pw).Thumbprint
          Import-PfxCertificate -FilePath certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw | Out-Null
          [IO.File]::AppendAllText($env:GITHUB_ENV, "WINDOWS_CERT_THUMBPRINT=$thumb`n")
          Remove-Item certificate.pfx

      # Windows signing is configured by thumbprint, not by environment
      # variable: the fragment is merged over tauri.conf.json at build time so
      # no machine-specific value is ever committed.
      - name: Prepare signing config (Windows)
        if: runner.os == 'Windows'
        run: |
          $windows = if ($env:WINDOWS_CERT_THUMBPRINT) { @{
            certificateThumbprint = $env:WINDOWS_CERT_THUMBPRINT
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } else { @{} }
          @{ bundle = @{ windows = $windows } } | ConvertTo-Json -Depth 4 -Compress |
            Out-File -Encoding utf8 signing.json
          Get-Content signing.json

      - name: Prepare signing config (Unix)
        if: runner.os != 'Windows'
        run: echo '{}' > signing.json

      # ── Build ───────────────────────────────────────────────────────────
      - name: Build bundles
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --config signing.json

      # ── Prove the signature, do not assume it ───────────────────────────
      - name: Verify signature (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        run: |
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app)
          codesign --verify --strict --verbose=2 "$app"

      - name: Verify notarization (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARIZING == 'true'
        run: |
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app)
          # `spctl` is what Gatekeeper itself asks: an unnotarized Developer ID
          # build is rejected here, which is the whole point of the check.
          spctl -a -vvv --type exec "$app"
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            xcrun stapler validate "$dmg"
          done

      - name: Verify signature (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        run: |
          $files = Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.msi,*.exe
          foreach ($file in $files) {
            $status = (Get-AuthenticodeSignature $file).Status
            Write-Host "$($file.Name): $status"
            if ($status -ne 'Valid') { throw "unsigned artifact: $($file.FullName)" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
