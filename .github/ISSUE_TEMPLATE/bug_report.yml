name: Bug report
description: Something is broken or behaves differently than documented.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include private file paths, serial
        numbers or catalog contents you do not want to make public.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version shown in the footer or the window title.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
        - macOS
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Open …
        2. Select …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error message and, if possible, a screenshot.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Catalog size, media type, whether it happens in demo mode, etc.
